name: AI Daily Brief
run-name: Morning news · ${{ inputs.date || 'manual-or-recovery' }}

on:
  schedule:
    # Recovery only. Cloudflare dispatches the primary run at 07:55 Berlin.
    - cron: "5 8 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional publish date to backfill (YYYY-MM-DD)"
        required: false
        type: string
      release_at:
        description: "Optional earliest publish time (ISO timestamp with timezone)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-daily-brief-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install .

      - name: Build and publish daily brief
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          DIGEST_TIMEZONE: Europe/Berlin
          PUBLISH_DATE: ${{ inputs.date || '' }}
          RELEASE_AT: ${{ inputs.release_at || '' }}
        run: python src/cli.py --publish --date "$PUBLISH_DATE" --release-at "$RELEASE_AT"
